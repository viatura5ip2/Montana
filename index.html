<!DOCTYPE html>
<html>
<head>
<title>Controle de Vtr</title>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbx6owC00pC-Ohcn7_c2fMY8ZVg97_fs9ARkwfHHYWimF899JNM-cFhTCJbbEYT6Kiof/exec"
width="900%"
height="100%"
allowfullscreen="true"
style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;"></iframe>
<script>
window.onload = function() {
document.querySelector('iframe').requestFullscreen().catch((err) => {
console.error("Error attempting to enable full-screen mode: $(err.message}");
});
};
</script>
</body>
</html>
